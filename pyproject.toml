[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "molscout"
version = "0.1.0"
description = "Detect chemical structure drawings in scientific PDFs and convert them to canonical SMILES."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Muhammad Obaidullah" }]
dependencies = [
    "rdkit==2026.3.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyarrow>=15",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
report = ["wandb==0.30.0", "plotly==7.1.0"]
# scripts/report/: rebuilds the W&B report in place
report-builder = ["wandb-workspaces==0.4.12", "markdown==3.11"]

[project.scripts]
molscout = "molscout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/molscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
