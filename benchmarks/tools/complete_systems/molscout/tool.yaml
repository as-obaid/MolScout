tool: molscout
name: MolScout
# The pipeline in this repository (src/molscout/pipeline) with MinerU 4.2.3, DECIMER Segmentation 1.3.0 and its
# classifier, MolGlyph large, MolScribe swin_base_char_aux_1m680k, MolNexTR molnextr_best and OPSIN; the 32b and
# both variants add BioMiner-Instruct (c865482) on vLLM.
version: 0.1.0
python: ${MOLSCOUT_STORE}/envs/molscout/bin/python
args:
- --pipeline-config
- pipeline.yaml
# Each run keeps its stage files across segments and reruns; render, parse, segment and the readers are shared by
# every variant on a dataset, so the ladder and joiner variants read the same drawings.
- --work
- ${MOLSCOUT_STORE}/pipeline/work/{run}
- --shared
- ${MOLSCOUT_STORE}/pipeline/shared/{dataset}
checkpoints:
- path: ${MOLSCOUT_STORE}/models/molglyph/molglyph_large.pt
  sha256: 15a0fab1aeb75d35e1aeaf8a49da4d39c15131892e64fd5c415a66bbddbc3d51
- path: ${MOLSCOUT_STORE}/models/molscribe/swin_base_char_aux_1m680k.pth
  sha256: 32821fa4ba8d17f9a92e374601438c5e757947dbf1141e9ad0ef51cccfa1c501
- path: ${MOLSCOUT_STORE}/models/molnextr/molnextr_best.pth
  sha256: 5990bc19aaafa5cf44e9d04e06fb8e2b5aea50c66e1e925f662bdff7d2a6422c
- path: ${MOLSCOUT_STORE}/models/decimer_ai/mask_rcnn_molecule.h5
  sha256: d42382a22585f98d8d7c8b480d2e0fcab58a9fa503133199fac839cb0f5fd4f9
env:
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  MINERU_TELEMETRY_DISABLED: '1'
  NO_ALBUMENTATIONS_UPDATE: '1'
  PYTHONDONTWRITEBYTECODE: '1'
lock_commands:
# every stage environment; the harness locks the molscout environment itself
- ['${HOME}/.local/bin/uv', pip, freeze, --python, '${MOLSCOUT_STORE}/envs/mineru/bin/python']
- ['${HOME}/.local/bin/uv', pip, freeze, --python, '${MOLSCOUT_STORE}/envs/decimer_ai/bin/python']
- ['${HOME}/.local/bin/uv', pip, freeze, --python, '${MOLSCOUT_STORE}/envs/molglyph/bin/python']
- ['${HOME}/.local/bin/uv', pip, freeze, --python, '${MOLSCOUT_STORE}/envs/molscribe/bin/python']
- ['${HOME}/.local/bin/uv', pip, freeze, --python, '${MOLSCOUT_STORE}/envs/molnextr/bin/python']
- ['${HOME}/.local/bin/uv', pip, freeze, --python, '${MOLSCOUT_STORE}/envs/biominer/bin/python']
# Every config runs every paper. The configuration was chosen on the development papers (Internal 1, 16 and 19
# and the 20 BioVista papers of data/manifests/biovista_dev.csv); the scores keep them apart from the rest.
variants:
  # MolScout as the benchmark scores it (molscout__biovista, molscout__internal): the combined joiner, chosen on
  # the development papers.
  default: [--joiner, both, --start-vllm]
  rules: [--joiner, rules]
  rules_review: [--joiner, rules, --export, accepted+review]
  # The 32B variants start BioMiner-Instruct (the pipeline's serve_32b.sh) when the 32B joiner first has work.
  32b: [--joiner, 32b, --start-vllm]
  both: [--joiner, both, --start-vllm]
  # The ladder: the rules joiner with the fixes switched on one step at a time.
  l0_drawings: [--joiner, rules, --fixes-only, none]
  l1_labels: [--joiner, rules, --fixes-only, 'labels,relevance']
  l2_tables: [--joiner, rules, --fixes-only, 'labels,relevance,tables']
  l3_core: [--joiner, rules, --fixes-only, 'labels,relevance,tables,core_check']
  l4_vote: [--joiner, rules, --fixes-only, 'labels,relevance,tables,core_check,vote']
  l5_stereo: [--joiner, rules, --fixes-only, 'labels,relevance,tables,core_check,vote,stereo']
  l6_junk: [--joiner, rules, --fixes-only, 'labels,relevance,tables,core_check,vote,stereo,junk']
  # The rules joiner with one of the two newest fixes switched off, to measure what each adds.
  no_attachments: [--joiner, rules, --fixes-off, attachments]
  no_slot_labels: [--joiner, rules, --fixes-off, slot_labels]
